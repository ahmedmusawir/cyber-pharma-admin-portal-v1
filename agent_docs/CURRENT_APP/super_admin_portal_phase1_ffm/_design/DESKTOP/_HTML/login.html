<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MissionControl — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--background:217 16% 90%;--foreground:220 24% 16%;--card:0 0% 100%;--card-foreground:220 24% 16%;--primary:12 93% 64%;--primary-foreground:0 0% 100%;--secondary:216 16% 88%;--secondary-foreground:220 24% 22%;--muted:216 16% 93%;--muted-foreground:220 10% 42%;--accent:216 16% 90%;--accent-foreground:220 24% 22%;--border:216 15% 80%;--input:216 15% 80%;--ring:12 93% 64%;--destructive:2 67% 51%;--success:131 54% 40%;--warning:41 93% 47%;--info:214 74% 53%;--radius:0px;}
.dark{--background:220 16% 22%;--foreground:218 22% 92%;--card:220 14% 27%;--card-foreground:218 22% 92%;--primary:12 93% 64%;--primary-foreground:0 0% 100%;--secondary:220 13% 31%;--secondary-foreground:218 22% 92%;--muted:220 13% 31%;--muted-foreground:218 14% 70%;--accent:220 13% 33%;--accent-foreground:218 22% 92%;--border:220 12% 38%;--input:220 12% 38%;--ring:12 93% 64%;--destructive:351 95% 71%;--success:142 69% 58%;--warning:41 93% 55%;--info:214 74% 64%;--radius:0px;}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:'Saira',system-ui,sans-serif;background:hsl(var(--background));color:hsl(var(--foreground));-webkit-font-smoothing:antialiased}.loginwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lbrand{display:flex;align-items:center;gap:10px;margin-bottom:22px}.lbrand svg{width:26px;height:26px}.lbrand b{font-weight:700;font-size:20px;letter-spacing:-.01em}
.lcard{width:380px;max-width:92vw;background:hsl(var(--card));border:1px solid hsl(var(--border));padding:30px 28px}
.lcard h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.lsub{font-size:13px;color:hsl(var(--muted-foreground));margin-top:5px;margin-bottom:22px}
.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.field input{width:100%;border:1px solid hsl(var(--input));background:hsl(var(--background));padding:11px 13px;font-size:14px;color:hsl(var(--foreground));font-family:inherit}
.field input::placeholder{color:hsl(var(--muted-foreground))}
.btn-primary{width:100%;border:0;background:hsl(var(--primary));color:hsl(var(--primary-foreground));padding:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:6px}
.btn-primary:hover{filter:brightness(.95)}
.lfoot{margin-top:18px;text-align:center;font-size:13px}.lfoot a{color:hsl(var(--primary));text-decoration:none;font-weight:500}
.lnote{margin-top:20px;font-size:12px;color:hsl(var(--muted-foreground));text-align:center}</style></head>
<body><div class="loginwrap">
<div class="lbrand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v5c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V6z"/></svg><b>MissionControl</b></div>
<div class="lcard">
<h1>Sign in</h1><div class="lsub">Super admin access</div>
<div class="field"><label>Email</label><input type="email" placeholder="you@cyberpharma.com"></div>
<div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>
<button class="btn-primary">Sign in</button>
<div class="lfoot"><a href="#">Forgot your password?</a></div>
</div>
<div class="lnote">Authorized super-admins only · no PHI lives here</div>
</div></body></html>
